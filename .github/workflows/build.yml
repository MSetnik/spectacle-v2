name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests on the runner's native architecture
        run: ./scripts/test.sh
      - name: Build and verify universal application
        run: ./scripts/build.sh
      - name: Build and verify sandboxed Shortcuts backend
        run: ./scripts/build-store.sh --check-only
      - uses: actions/upload-artifact@v4
        with:
          name: Spectacle-universal-${{ matrix.runner }}
          path: build/dist/Spectacle-universal.zip
          if-no-files-found: error
